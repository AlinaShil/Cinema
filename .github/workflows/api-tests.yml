name: API Tests

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  api-tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start services via Docker Compose and wait for readiness
        run: |
          set -eo pipefail
          set -x  # включить печать команд

          # Обязательно подтягиваем свежие образы
          docker compose pull

          # Поднимаем стек с принудительным pull (если поддерживается)
          docker compose up --pull=always -d zookeeper kafka postgres monolith movies-service events-service proxy-service
          
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 120

      - name: Debug endpoints
        run: |
          echo "=== Final sanity checks ==="
          echo "Movies /api/movies/health:"; curl -i http://localhost:8081/api/movies/health  true
          echo "Events /api/events/health:"; curl -i http://localhost:8082/api/events/health  true
          echo "Proxy /health:"; curl -i http://localhost:8000/health || true
          echo "Monolith /health:"; curl -i http://localhost:8080/health  true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install

      - name: Run API tests
        working-directory: tests/postman
        run: |

          docker compose up -d
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 15
          # Build the Docker image
          docker build -t cinemaabyss-api-tests .

          # Run the tests in Docker
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests

      - name: Tear down
        if: always()
        run: docker compose down