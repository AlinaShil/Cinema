name: API Tests

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log in to GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start services via Docker Compose
        run: |
          set -euo pipefail
          docker compose pull
          docker compose up -d zookeeper kafka monolith movies-service events-service proxy-service

          echo "=== Waiting for services to become healthy ==="
          max=30
          attempt=0
          until curl -fs http://localhost:8080/health && \
                curl -fs http://localhost:8081/api/movies/health && \
                curl -fs http://localhost:8082/api/events/health && \
                curl -fs http://localhost:8000/health; do
            attempt=$((attempt+1))
            echo "Attempt $attempt/${max} - services not ready yet"
            if [ "$attempt" -ge "$max" ]; then
              echo "ERROR: services did not become ready in time"
              docker compose ps
              docker compose logs --tail=100
              exit 1
            fi
            sleep 5
          done
          echo "All services are up"

      - name: Debug endpoints
        run: |
          echo "Monolith /health:"; curl -i http://localhost:8080/health  true
          echo "Movies /health:"; curl -i http://localhost:8081/api/movies/health  true
          echo "Events /health:"; curl -i http://localhost:8082/api/events/health  true
          echo "Proxy /health:"; curl -i http://localhost:8000/health  true

      - name: Run API Tests
        run: |
          npm install -g newman
          newman run ./tests/postman/CinemaAbyss.postman_collection.json \
            --env-var "baseMonolith=http://localhost:8080" \
            --env-var "baseMovies=http://localhost:8081" \
            --env-var "baseEvents=http://localhost:8082" \
            --env-var "baseProxy=http://localhost:8000" \
            --timeout-request 10000