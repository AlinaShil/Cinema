name: API Tests

on:
  workflow_run:
    workflows: ["Docker Build and Push"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR (если образы в GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start services via Docker Compose and wait for readiness
        run: |
          set -euo pipefail
          docker compose pull
          docker compose up -d zookeeper kafka monolith movies-service events-service proxy-service

          echo "=== Waiting for services to become healthy ==="
          max=30
          attempt=0
          while true; do
            ((attempt++))
            echo "--- attempt $attempt/$max ---"
            ok=true

            for url in http://localhost:8080/health http://localhost:8081/api/movies/health http://localhost:8082/api/events/health http://localhost:8000/health; do
              if curl -fs "$url" >/dev/null 2>&1; then
                echo "$url OK"
              else
                echo "$url DOWN"
                ok=false
              fi
            done

            if [ "$ok" = true ]; then
              echo "All services are up"
              break
            fi

            if [ "$attempt" -ge "$max" ]; then
              echo "ERROR: services did not become ready in time"
              docker compose ps
              docker compose logs --tail=100 monolith movies-service events-service proxy-service
              exit 1
            fi

            sleep 5
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: |
          newman run tests/postman/CinemaAbyss.postman_collection.json \
            --env-var "baseMonolith=http://localhost:8080" \
            --env-var "baseMovies=http://localhost:8081" \
            --env-var "baseEvents=http://localhost:8082" \
            --env-var "baseProxy=http://localhost:8000" \
            --timeout-request 10000

      - name: Tear down
        if: always()
        run: docker compose down