name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/microservices/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/microservices/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/microservices/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Monolith Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Movies Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Events Service
      - name: Extract metadata for Events Service
        id: meta-events
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}
          tags: |                                                   
            type=semver,pattern={{version}}                         
            type=semver,pattern={{major}}.{{minor}}                 
            type=sha,format=short                                   
            type=ref,event=branch                                   
            latest                                                 

      - name: Build and push Events Service image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proxy Service
      - name: Extract metadata for Proxy Service
        id: meta-proxy
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}
          tags: |                                                 
            type=semver,pattern={{version}}                      
            type=semver,pattern={{major}}.{{minor}}               
            type=sha,format=short                                 
            type=ref,event=branch                                 
            latest                                               

      - name: Build and push Proxy Service image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start services via Docker Compose
        run: |
          docker compose pull
          docker compose up -d zookeeper kafka monolith movies-service events-service proxy-service
          echo "Waiting for services to become healthy..."
            for i in {1..30}; do
              if curl -fs http://localhost:8080/health && \
                 curl -fs http://localhost:8081/api/movies/health && \
                 curl -fs http://localhost:8082/api/events/health && \
                 curl -fs http://localhost:8000/health; then
                 echo "All services are up"
                 break
              fi
              sleep 5
            done

      # API Tests
      - name: Run API Tests
        run: |                                                        
          npm install -g newman                                      
          newman run ./tests/postman/CinemaAbyss.postman_collection.json \ 
            --env-var "baseMonolith=http://localhost:8080" \       
            --env-var "baseMovies=http://localhost:8081" \         
            --env-var "baseEvents=http://localhost:8082" \         
            --env-var "baseProxy=http://localhost:8000" \         
            --timeout-request 10000                                 
