apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # Общий входной шлюз / корень — идёт в proxy (например, для UI или маршрутизации)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000

          # API пользователей и фильмов через proxy (gateway)
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000

          - path: /api/movies
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000

          # События напрямую к events-service (для тестирования Kafka MVP)
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082

          # Хэлсчек-пробросы (если тесты обращаются напрямую)
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000

          - path: /api/movies/health
            pathType: Prefix
            backend:
              service:
                name: movies-service
                port:
                  number: 8081

          - path: /api/events/health
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082
